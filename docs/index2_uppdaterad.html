
<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Årskullsanalys – Enkel version</title>
  <style>
    body { font-family: sans-serif; background: #f8fafc; color: #0f172a; margin: 0; padding: 2rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, button { padding: 0.5rem; font-size: 1rem; margin-top: 0.5rem; width: 100%; max-width: 300px; }
    button { background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .muted { font-size: 0.9rem; color: #64748b; margin-top: 0.25rem; }
    canvas { margin-top: 2rem; background: white; border: 1px solid #e5e7eb; border-radius: 8px; }
    table { width: 100%; margin-top: 2rem; border-collapse: collapse; }
    th, td { padding: 0.5rem; border-bottom: 1px solid #e5e7eb; text-align: left; }
    .pos { color: green; font-weight: bold; }
    .neg { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Årskullsanalys från Kolada (förenklad)</h1>
  <label for="kommun">Kommunkod</label>
  <input id="kommun" placeholder="t.ex. 0684 för Sävsjö" />

  <label><input type="checkbox" id="showNation" /> Visa Riket (0000)</label>
  <label><input type="checkbox" id="useKoladaPeers" /> Hämta liknande kommuner (grundskola)</label>

  <label for="start">Startår</label>
  <input id="start" type="number" value="2013" />
  <label for="end">Slutår</label>
  <input id="end" type="number" />
  <div class="muted" id="endHint"></div>

  <button id="fetchBtn">Hämta från Kolada</button>

  <canvas id="chart" height="120"></canvas>

  <table id="cohortTable" style="display:none">
    <thead>
      <tr><th>Årskull</th><th>Åk 6 (%)</th><th>Åk 9 (%)</th><th>Skillnad</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    const KOLADA_BASE = "https://api.kolada.se/v2";
    const elKommun = document.getElementById('kommun');
    const elStart = document.getElementById('start');
    const elEnd = document.getElementById('end');
    const elEndHint = document.getElementById('endHint');
    const elShowNation = document.getElementById('showNation');
    const elUseKoladaPeers = document.getElementById('useKoladaPeers');
    const btn = document.getElementById('fetchBtn');

    const currentYear = new Date().getFullYear();
    elEnd.value = currentYear - 1;
    elEndHint.textContent = `Initierat till ${currentYear - 1} (senaste färdiga året i regel).`;

    let chart;

    async function findKpiIdByTitle(query, mustInclude){
      const url = `${KOLADA_BASE}/kpi?title=${encodeURIComponent(query)}`;
      const res = await fetch(url);
      const json = await res.json();
      return (json.values || []).find(k => k.title.toLowerCase().includes(mustInclude.toLowerCase()))?.id || null;
    }

    async function fetchSeries(kpiId, municipalityId, years){
      const url = `${KOLADA_BASE}/data/kpi/${kpiId}/municipality/${municipalityId}/year/${years.join(',')}`;
      const res = await fetch(url);
      const json = await res.json();
      return (json.values || []).map(r => {
        const tot = (r.values || []).find(v => v.gender === 'T');
        return { year: Number(r.period), value: tot?.value ?? null };
      });
    }

    async function fetchLiknandeKommuner(kod){
      const res = await fetch(`${KOLADA_BASE}/municipality_group/GRK/municipality`);
      if (!res.ok) throw new Error("Kunde inte hämta liknande kommuner från Kolada");
      const json = await res.json();
      const lista = json?.values ?? [];
      const grupp = lista.find(g => g.municipalities?.includes(kod));
      return grupp?.municipalities?.filter(k => k !== kod) ?? [];
    }/municipality_group/GRK/municipality`);
      const json = await res.json();
      const grupp = json.values.find(g => g.municipalities.includes(kod));
      return grupp?.municipalities.filter(k => k !== kod) ?? [];
    }

    function buildCohorts(ak6, ak9){
      const map9 = new Map(ak9.map(d => [d.year, d.value]));
      return ak6.map(d6 => {
        const v9 = map9.get(d6.year + 3);
        const diff = (v9 != null && d6.value != null) ? (v9 - d6.value) : null;
        return { label: `${d6.year} → ${d6.year + 3}`, v6: d6.value, v9, diff };
      });
    }

    function renderTable(cohorts){
      const tbody = document.querySelector('#cohortTable tbody');
      tbody.innerHTML = '';
      for (const c of cohorts){
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${c.label}</td><td>${c.v6 ?? '—'}</td><td>${c.v9 ?? '—'}</td><td class="${c.diff >= 0 ? 'pos' : 'neg'}">${c.diff?.toFixed(1) ?? '—'}</td>`;
        tbody.appendChild(tr);
      }
      document.getElementById('cohortTable').style.display = 'table';
    }

    function renderChart(years, s6, s9){
      const ctx = document.getElementById('chart').getContext('2d');
      if(chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: years,
          datasets: [
            { label: 'Åk 6', data: s6, spanGaps: true },
            { label: 'Åk 9', data: s9, spanGaps: true }
          ]
        },
        options: {
          scales: {
            y: { suggestedMin: 0, suggestedMax: 100, ticks: { callback: v => v + '%' } }
          }
        }
      });
    }

    btn.addEventListener('click', async () => {
      try {
        btn.disabled = true; btn.textContent = 'Hämtar...';
        const kod = elKommun.value.trim();
        const years = Array.from({length: elEnd.value - elStart.value + 1}, (_, i) => Number(elStart.value) + i);
        const id6 = await findKpiIdByTitle("Elever i åk 6", "alla ämnen");
        const id9 = await findKpiIdByTitle("Elever i åk 9", "alla ämnen");

        const main6 = await fetchSeries(id6, kod, years);
        const main9 = await fetchSeries(id9, kod, years);

        let all6 = [...main6];
        let all9 = [...main9];

        if (elShowNation.checked) {
          const nat6 = await fetchSeries(id6, '0000', years);
          const nat9 = await fetchSeries(id9, '0000', years);
          all6 = all6.concat(nat6);
          all9 = all9.concat(nat9);
        }

        if (elUseKoladaPeers.checked) {
          const peers = await fetchLiknandeKommuner(kod);
          const peer6all = await Promise.all(peers.map(k => fetchSeries(id6, k, years)));
          const peer9all = await Promise.all(peers.map(k => fetchSeries(id9, k, years)));

          const peer6 = years.map(y => {
            const vals = peer6all.map(p => p.find(r => r.year === y)?.value).filter(v => v != null);
            return { year: y, value: vals.length ? vals.reduce((a,b)=>a+b)/vals.length : null };
          });

          const peer9 = years.map(y => {
            const vals = peer9all.map(p => p.find(r => r.year === y)?.value).filter(v => v != null);
            return { year: y, value: vals.length ? vals.reduce((a,b)=>a+b)/vals.length : null };
          });

          all6 = all6.concat(peer6);
          all9 = all9.concat(peer9);
        }

        const yearsAll = Array.from(new Set(all6.concat(all9).map(d => d.year))).sort((a,b)=>a-b);
        const s6 = yearsAll.map(y => all6.find(d => d.year === y)?.value ?? null);
        const s9 = yearsAll.map(y => all9.find(d => d.year === y)?.value ?? null);
        renderChart(yearsAll, s6, s9);
        renderTable(buildCohorts(main6, main9));
      } catch (err) {
        alert(err.message || err);
      } finally {
        btn.disabled = false; btn.textContent = 'Hämta från Kolada';
      }
    });
  </script>
</body>
</html>
